[package]
name = "app"
version = "0.1.0"
description = "Mezbaan desktop: POS and kitchen display windows (Tauri shell)"
authors = ["Mezbaan"]
license = ""
repository = "https://github.com/RJ-SHANOO/Mezbaan"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
keyring = "4.2.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.7.0"
uuid = { version = "1", features = ["v7"] }
