[package]
name = "app"
version = "0.1.0"
description = "Mezbaan desktop: POS and kitchen display windows (Tauri shell)"
authors = ["Mezbaan"]
license = ""
repository = "https://github.com/RJ-SHANOO/Mezbaan"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl"] }
rand = "0.8"
keyring = "4.2.0"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-autostart = "2.7.0"
uuid = { version = "1", features = ["v7"] }
# blocking, not the async client: operation_log's Connection is behind a plain
# std::sync::Mutex (DbState), and a blocking HTTP call from a background sync cycle
# needs no async runtime of its own — reqwest 0.13 to match the version already
# pulled in transitively by tauri-plugin-updater. Deliberately not touching
# default-features/TLS backend here: tauri-plugin-updater's own reqwest usage already
# builds fine, and Cargo unifies features for one resolved version across the whole
# graph — narrowing this crate's own feature request (e.g. default-features = false)
# changed the *unified* result and triggered a from-source OpenSSL build that isn't
# set up to succeed in this environment (perl not configured for it).
reqwest = { version = "0.13", features = ["blocking", "json"] }
# Pure Rust, no C/OpenSSL compilation at all — verifies the Ed25519 signature on
# each downstream sync snapshot (P1-27/P1-27b) against the server's public key.
# "pkcs8" so a server-issued SPKI PEM public key can be parsed directly, no manual
# ASN.1 handling.
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
base64 = "0.22"
# Matches packages/nest-core/src/password.ts's hashPassword/verifyPassword exactly
# (N=16384, r=8, p=1, 64-byte output, "salthex:hashhex" encoding) — same algorithm,
# same parameters, so a manager's PIN hash synced down (P1-27) verifies offline the
# identical way the server would verify it online.
scrypt = { version = "0.11", default-features = false }
