name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mezbaan
          POSTGRES_PASSWORD: mezbaan_dev_password
          POSTGRES_DB: mezbaan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mezbaan -d mezbaan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Owner connection, for migrations/seeding only — bypasses RLS (rule: never used
      # for anything that reads or writes tenant data). See packages/db/.env.example.
      DATABASE_URL: postgres://mezbaan:mezbaan_dev_password@localhost:5432/mezbaan
      # Restricted role the tenant-isolation tests actually run as, so RLS applies.
      APP_DATABASE_URL: postgres://mezbaan_app:mezbaan_app_dev_password@localhost:5432/mezbaan
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Apply database migrations
        run: node packages/db/dist/migrate.js

      - name: Seed roles and permissions
        run: node packages/db/dist/seed-cli.js

      - name: Test
        run: pnpm test

  migrations:
    name: Check migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for pending schema changes without a migration
        run: pnpm --filter @mezbaan/db run migrate:check
